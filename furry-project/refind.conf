timeout 0
scanfor manual
showtools reboot,shutdown,about,firmware
hideui hints,arrows,badges
use_nvram false
include themes/finn-term/theme.conf
menuentry "Ubuntu - demo EFI" {
    loader /EFI/demo/demo.efi
    icon /EFI/BOOT/themes/finn-term/icons/os_ubuntu.png
}
menuentry "Windows - demo EFI" {
    loader /EFI/demo/demo.efi
    icon /EFI/BOOT/themes/finn-term/icons/os_win.png
}
