# finn-term: terminal-style rEFInd theme in black/purple/pink
# https://github.com/FaeArtz/refind-finn-term

icons_dir themes/finn-term/icons

banner themes/finn-term/background.png
banner_scale fillscreen

selection_big themes/finn-term/selection_big.png
selection_small themes/finn-term/selection_small.png

font themes/finn-term/fonts/jetbrains-mono-45.png

big_icon_size 256
small_icon_size 96

# Choose the largest firmware graphics mode, then scale to actual pixel size.
resolution max
theme_auto_scale true

dynamic_info true

# Physical firmware may hang on PCI/controller queries. Opt in after testing.
dynamic_device_probe false

# Enable raw SMBIOS tables only after testing firmware compatibility.
dynamic_smbios false
